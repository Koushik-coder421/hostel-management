name: ScopeMap - Change-Impact Analysis

on:
  pull_request:
    branches: [ main, dev ]

permissions:
  contents: read
  pull-requests: write

jobs:
  impact-analysis:
    name: Code Impact & Boundary Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run ScopeMap Impact Analysis
        uses: POORNA-12/ScopeMap@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          diff-range: origin/${{ github.base_ref }}...HEAD
          fail-on: none
